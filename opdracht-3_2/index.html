<!DOCTYPE html>
<html>
<head>
<title>Hallo Hi, Abbonnomentsformulier</title>
</head>
<body>

<h1>Hallo Hi, Abbonomentsformulier</h1>


<form action="#" method="post">
<label for="Voornaam">Voornaam</label>
<input type="text"id="Voornaam"name="voornaam"
pattern="[A-Za-zÀ-ÿ\s-]+"
title="Gebruik alleen letters" required>
<br>
<br>

<form action="#" method="post">
<label for="Achternaam">Achternaam</label>
<input type="text"id="Achternaam"name="Achternaam"
pattern="[A-Za-zÀ-ÿ\s-]+"
title="Gebruik alleen letters" required>
<br>
<br>


<label> Aanhef</label>
<input type="radio" id="dhr" name="aanhef" value="Dhr."checked>
<label for="dhr">Dhr.</label>

<input type="radio" id="Mvr" name="aanhef" value="Mvr.">
<label for="Mvr">Mvr.</label>

<input type="radio" id="Anders" name="aanhef" value="Anders.">
<label for="Anders">Anders.</label>
<br>
<br>

<label for="straat">Straat met huisnummer</label>
<input type="text" id="name" name="straat" placeholder="Stationsweg 12" required>
<br>
<br>
<label for="postcode">Postcode</label>
<input type="text" id="postcode" name="postcode"
pattern="[1-9][0-9]{3}\s?[A-Z]{2}"
placeholder="1234 AB"
required>
<br>
<br>

<form>
  

  

 

  <div>
    <label for="woonplaats">Woonplaats:</label><br>
    <input type="text" id="woonplaats" name="woonplaats" placeholder="Bijv. Amsterdam" required>
  </div>

  <br>

  <div>
    <label for="land">Land:</label><br>
    <select id="land" name="land">
      <option value="nl" selected>Nederland</option>
      <option value="be">België</option>
      <option value="de">Duitsland</option>
      <option value="fr">Frankrijk</option>
      <option value="overig">Overig</option>
    </select>
  </div>

  <br>
  
</form>


<label for="iban">IBAN-nummer</label>
<input type="text" id="iban" name="iban"
maxlength="18"
pattern="NL[0-9]{2}[A-Z]{4}{10}"
placeholder="NL91ABNA0417164300"
required><br><br>


<label for="abonnement">Type Abonement</label>
<select id="abonnement" name="abonnement" required>
<option value="">Kies een abonnement</option>
<option>Mobiel</option>
<option>Glasvezel</option>
<option>TV</option>
</select>

<br><br>

<label for="datum">Datum van ingang abonnement:</label><br>
<input type="date" id="datum" name="datum" min="2026-10-14" required>
<br><br>

<form action="#" method="post">
<label for="E-mail">E-mail adres</label>
<input type="text"id="Voornaam"name="voornaam"
pattern="[A-Za-zÀ-ÿ\s-]+"
title="Gebruik alleen letters" required>
<br>
<br>

<label for="wachtwoord">Wachtwoord</label>
    <input type="password" name="wachtwoord" placeholder="Voer je wachtwoord in">

<br>
<br>
<form>
  
 

  
  <div>
    <label for="looptijd">Looptijd abonnement (in maanden):</label><br>
    <input type="number" id="looptijd" name="looptijd" value="12" min="1" max="60">
  </div>

  <br>
  
  

  <form>
   <div>
    <label for="gebruikers">Aantal gebruikers:</label><br>
    <input type="number" id="gebruikers" name="gebruikers" value="1" min="1" max="4">
    <br><br>
<button type="submit">Versturen</button>
  </div>


  <br>
  

</form>
</form>


</form>




</body>
</html>
