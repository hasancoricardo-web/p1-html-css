<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Abonnementsformulier Hallo Hi</title>
</head>
<body>

  <h1>Je abonnement binnen 5 minuten geregeld
  
  </h1>

  <form action="#" method="POST">

    <!-- 1. Voornaam -->
    <p>
      <label for="voornaam">Voornaam:</label><br>
      <input type="text" id="voornaam" name="voornaam" pattern="^[^\d]+$" title="Geen cijfers toegestaan" required>
    </p>

    <!-- 2. Achternaam -->
    <p>
      <label for="achternaam">Achternaam:</label> <br>
      <input type="text" id="achternaam" name="achternaam" pattern="^[^\d]+$" title="Geen cijfers toegestaan" required>
    </p>

    <!-- 3. Aanhef -->
    <p>
      <label>Aanhef:</label><br>
      <input type="radio" id="dhr" name="aanhef" value="Dhr." checked required>
      <label for="dhr">Dhr.</label>

      <input type="radio" id="mevr" name="aanhef" value="Mevr.">
      <label for="mevr">Mevr.</label>

      <input type="radio" id="anders" name="aanhef" value="Anders">
      <label for="anders">Anders</label>
    </p>

    <!-- 4. Straat met huisnummer -->
    <p>
      <label for="adres">Straat met huisnummer:</label><br>
      <input type="text" id="adres" name="adres" placeholder="Stationsweg 12" required>
    </p>

    <!-- 5. Postcode -->
    <p>
      <label for="postcode">Postcode:</label><br>
      <input type="text" id="postcode" name="postcode" pattern="[1-9][0-9]{3}\s?[A-Za-z]{2}" placeholder="1234 AB" title="Formaat: 1234 AB" required>
    </p>

    <!-- 6. Woonplaats -->
    <p>
      <label for="woonplaats">Woonplaats:</label><br>
      <input type="text" id="woonplaats" name="woonplaats" required>
    </p>

    <!-- 7. Land -->
    <p>
      <label for="land">Land:</label><br>
      <select id="land" name="land" required>
        <option value="Nederland" selected>Nederland</option>
        <option value="België">België</option>
        <option value="Duitsland">Duitsland</option>
      </select>
    </p>

    <!-- 8. IBAN-nummer -->
    <p>
      <label for="iban">IBAN-nummer:</label><br>
      <input type="text" id="iban" name="iban
